<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · PostAPI</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">
      <span class="brand-icon">⚡</span>PostAPI
    </a>
    <div class="navbar-links">
      <a href="/"           class="nav-link" data-page="home">Home</a>
      <a href="/docs.html"  class="nav-link" data-page="docs">Docs</a>
      <a href="/stats.html" class="nav-link" data-page="stats">Stats</a>
      <a href="/swagger/index.html" class="nav-link external" target="_blank" rel="noopener">Swagger</a>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
  </div>
</nav>

<div class="page-wrap" style="display:flex; align-items:center; justify-content:center; min-height:calc(100vh - var(--nav-h) - 80px);">
  <div class="not-found">
    <div class="not-found-code">404</div>
    <h2>Page not found</h2>
    <p>The path <code id="bad-path" class="mono" style="color:var(--primary);"></code> doesn't exist. It may have moved or the URL is mistyped.</p>
    <div class="not-found-links">
      <a href="/"           class="btn btn-primary">← Go Home</a>
      <a href="/docs.html"  class="btn btn-ghost">API Docs</a>
      <a href="/stats.html" class="btn btn-ghost">Stats</a>
      <a href="/swagger/index.html" class="btn btn-ghost" target="_blank" rel="noopener">Swagger ↗</a>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer">
  <div class="container">
    <div class="footer-inner">
      <div class="footer-brand"><span style="font-size:1.1rem;">⚡</span> PostAPI</div>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/docs.html">Docs</a>
        <a href="/swagger/index.html" target="_blank" rel="noopener">Swagger</a>
      </div>
      <div class="footer-copy">Built with .NET 8 · Clean Architecture</div>
    </div>
  </div>
</footer>

<script src="/js/main.js"></script>
<script>
  const p = document.getElementById('bad-path');
  if (p) p.textContent = window.location.pathname;
</script>
</body>
</html>
