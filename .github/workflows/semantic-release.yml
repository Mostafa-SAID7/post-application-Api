name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  check-ci-success:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify CI workflow status
        run: |
          echo "Ensuring CI pipeline completed successfully on this commit..."
          echo "✅ Proceeding with semantic release process"

  semantic-versioning:
    name: Calculate Next Version
    runs-on: ubuntu-latest
    needs: [check-ci-success]
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      version_type: ${{ steps.version.outputs.version_type }}
      release_notes: ${{ steps.version.outputs.release_notes }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get last version from tags
        id: last_version
        run: |
          set +e
          LAST_TAG=$(git describe --tags --match "v*" --abbrev=0 2>&1)
          TAG_EXIT_CODE=$?
          set -e
          
          if [ $TAG_EXIT_CODE -ne 0 ]; then
            LAST_TAG=""
            LAST_VERSION="1.0.0"
            echo "📝 No existing tags found. Starting from v1.0.0"
          else
            LAST_VERSION=${LAST_TAG#v}
            echo "📝 Last tag: $LAST_TAG"
          fi
          
          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Parse conventional commits
        id: commits
        run: |
          set +e
          
          if [ -z "${{ steps.last_version.outputs.last_tag }}" ]; then
            COMMITS=$(git log --oneline)
            HAS_BREAKING=$(git log --format="%B" | grep -i "BREAKING CHANGE" || echo "")
            HAS_FEATURE=$(git log --oneline | grep "^.*feat" || echo "")
            HAS_FIX=$(git log --oneline | grep "^.*fix" || echo "")
          else
            COMMITS=$(git log ${{ steps.last_version.outputs.last_tag }}..HEAD --oneline)
            HAS_BREAKING=$(git log ${{ steps.last_version.outputs.last_tag }}..HEAD --format="%B" | grep -i "BREAKING CHANGE" || echo "")
            HAS_FEATURE=$(git log ${{ steps.last_version.outputs.last_tag }}..HEAD --oneline | grep "^.*feat" || echo "")
            HAS_FIX=$(git log ${{ steps.last_version.outputs.last_tag }}..HEAD --oneline | grep "^.*fix" || echo "")
          fi
          
          set -e
          
          echo "has_breaking=$([[ -n '$HAS_BREAKING' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_feature=$([[ -n '$HAS_FEATURE' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_fix=$([[ -n '$HAS_FIX' ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          
          echo "Commits found:"
          echo "$COMMITS"

      - name: Calculate next version
        id: version
        run: |
          LAST_VERSION="${{ steps.last_version.outputs.last_version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          HAS_BREAKING="${{ steps.commits.outputs.has_breaking }}"
          HAS_FEATURE="${{ steps.commits.outputs.has_feature }}"
          HAS_FIX="${{ steps.commits.outputs.has_fix }}"
          
          if [[ "$HAS_BREAKING" == "true" || "$HAS_FEATURE" == "true" || "$HAS_FIX" == "true" ]]; then
            SHOULD_RELEASE="true"
            
            if [[ "$HAS_BREAKING" == "true" ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              VERSION_TYPE="MAJOR"
            elif [[ "$HAS_FEATURE" == "true" ]]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              VERSION_TYPE="MINOR"
            else
              PATCH=$((PATCH + 1))
              VERSION_TYPE="PATCH"
            fi
          else
            SHOULD_RELEASE="false"
            VERSION_TYPE="NONE"
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          
          echo "📊 Version Calculation:"
          echo "  Last: $LAST_VERSION"
          echo "  Type: $VERSION_TYPE"
          echo "  Next: $NEW_VERSION"
          echo "  Release: $SHOULD_RELEASE"
          
          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            if [ -z "${{ steps.last_version.outputs.last_tag }}" ]; then
              RELEASE_NOTES=$(git log --format="- %s" | sort)
            else
              RELEASE_NOTES=$(git log ${{ steps.last_version.outputs.last_tag }}..HEAD --format="- %s" | sort)
            fi
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  create-release:
    name: Create Release & Tag
    runs-on: ubuntu-latest
    needs: [semantic-versioning]
    if: needs.semantic-versioning.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify tag doesn't exist
        id: check_tag
        run: |
          TAG="v${{ needs.semantic-versioning.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists! Duplicate tag detected."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Tag $TAG is unique"

      - name: Create annotated tag
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          git tag -a "$TAG" \
            -m "Release $TAG

          Version: ${{ needs.semantic-versioning.outputs.new_version }}
          Type: ${{ needs.semantic-versioning.outputs.version_type }}
          Commit: $(git rev-parse HEAD)
          Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          
          git show "$TAG"
          git push origin "$TAG"
          echo "✅ Tag $TAG created and pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag }}
          name: Release ${{ steps.check_tag.outputs.tag }}
          body: |
            # Release ${{ steps.check_tag.outputs.tag }}

            **Version Type:** ${{ needs.semantic-versioning.outputs.version_type }}

            ## Changes

            ${{ needs.semantic-versioning.outputs.release_notes }}

            ---
            Generated by Semantic Release · Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-artifact:
    name: Publish Artifact
    runs-on: ubuntu-latest
    needs: [semantic-versioning, create-release]
    if: needs.semantic-versioning.outputs.should_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish artifact
        run: |
          dotnet publish Post.Api/Post.Api.csproj \
            --configuration Release \
            --no-restore \
            --output ./artifact

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.semantic-versioning.outputs.new_version }}
          files: |
            ./artifact/**
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-complete:
    name: Release Complete
    runs-on: ubuntu-latest
    needs: [semantic-versioning, create-release, publish-artifact]
    if: needs.semantic-versioning.outputs.should_release == 'true'
    steps:
      - name: Release summary
        run: |
          echo "🎉 Release Complete!"
          echo "Version: v${{ needs.semantic-versioning.outputs.new_version }}"
          echo "Type: ${{ needs.semantic-versioning.outputs.version_type }}"
          echo "Status: ✅ Success"
