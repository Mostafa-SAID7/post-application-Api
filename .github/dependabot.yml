version: 2

updates:
  # NuGet package updates
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - "memo"
    assignees:
      - "memo"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore pre-release versions unless explicitly needed
      - dependency-name: "*"
        update-types:
          - "version-update:semver-prerelease"
    # Fail on any missing dependency metadata
    fail-on-non-existent-files: false
    # Rebase stale pull requests
    rebase-strategy: "auto"
    # Allow up to 2 open PRs per ecosystem
    pull-request-branch-name:
      separator: "/"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "memo"
    assignees:
      - "memo"
    labels:
      - "ci/cd"
      - "github-actions"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
    # Only allow patch and minor updates for actions
    allow:
      - dependency-type: "direct"
    # Ignore pre-release versions
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-prerelease"
    rebase-strategy: "auto"

  # Version updates (also triggers semantic release)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "UTC"
    labels:
      - "ci/cd"
